name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt system dependencies (PySide6 headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Protocol JVM tests
        run: cd android && ./gradlew :protocol:test --no-daemon --console=plain
      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain

  # 仅在推送 v* tag 时发布：从 Secret 重建 keystore，签名并附到 GitHub Release。
  # 需配置 4 个仓库 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      # 从 base64 Secret 还原 keystore（不入库），路径与本地 keystore.properties 一致。
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      # 动态生成 keystore.properties，复用 build.gradle.kts 既有的 release 签名逻辑。
      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          cd android && ./gradlew :app:assembleRelease \
            -PversionName="${TAG_VERSION#v}" \
            --no-daemon --console=plain

      # 重命名为带版本号的产物名，便于 Release 下载者识别。
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
