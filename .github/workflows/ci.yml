name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'   # 钉死补丁版本：本地 .venv（Anaconda 3.12.7）与打包产物必须同运行时，否则本地验真包与线上发布包不是同一份
          cache: pip
      - name: Install Qt system dependencies (PySide6 headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 显式指定 packages：action 默认要装 'tools'，但该包已从新版 SDK 仓库移除，
      # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并 exit 1。
      # platform-tools 足够；platforms/build-tools 由 AGP 按需下载。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Protocol JVM tests
        run: cd android && ./gradlew :protocol:test --no-daemon --console=plain
      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain

  # 仅在推送 v* tag 时发布：从 Secret 重建 keystore，签名并附到 GitHub Release。
  # 需配置 4 个仓库 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 显式指定 packages：action 默认要装 'tools'，但该包已从新版 SDK 仓库移除，
      # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并 exit 1。
      # platform-tools 足够；platforms/build-tools 由 AGP 按需下载。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 从 base64 Secret 还原 keystore（不入库），路径与本地 keystore.properties 一致。
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      # 动态生成 keystore.properties，复用 build.gradle.kts 既有的 release 签名逻辑。
      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          cd android && ./gradlew :app:assembleRelease \
            -PversionName="${TAG_VERSION#v}" \
            --no-daemon --console=plain

      # 重命名为带版本号的产物名，便于 Release 下载者识别。
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" \
               android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk --clobber

  # PC 端 Windows 可执行包（PyInstaller）：tag 触发，与 Android 同一 Release。
  # needs release 确保 Release 已创建，PC 仅 upload 追加 zip，避免竞态。
  release-pc:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'   # 钉死补丁版本：本地 .venv（Anaconda 3.12.7）与打包产物必须同运行时，否则本地验真包与线上发布包不是同一份
      - name: Install dependencies
        run: |
          pip install -r requirements.txt   # 已含 pyinstaller==6.21.0
          # 打包用 headless opencv（qrferry 只用 videoio/imgproc，不用 imshow/waitKey）。
          # 实测：opencv-python 5.0.0.93 的 full 与 headless 装出的 cv2.pyd 二进制
          # 完全相同（sha256[:16]=eefedf6ee006a84b，即 requirements.txt 记的指纹），
          # 所以这步对 cv2 行为无影响，只省掉少量 GUI 依赖。
          # 真正与本地不同源的是 Python 补丁版本：CI 的 setup-python 取到最新的
          # 3.12.x，本地 .venv 是 3.12.7（实测线上包内 python312.dll=3.12.10）。
          # 版本要严格一致时，把 venv 补到与 CI 相同的补丁版本再比对。
      # 打包参数统一由 qr-ferry.spec 持有（本地与 CI 同一条命令），避免两处
      # exclude 清单各改各的而悄悄漂移。
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean qr-ferry.spec
      # 版本号三处一致（pyproject / qrferry.__version__ / tag）才产出，否则拒绝，
      # 防止打出文件名与程序自报版本不符的错标包。
      - name: Package zip
        run: python scripts/pack_windows_zip.py "${{ github.ref_name }}"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "dist\qr-ferry-${{ github.ref_name }}-windows-x64.zip" --clobber
