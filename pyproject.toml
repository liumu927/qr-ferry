[project]
name = "qrferry"
version = "0.1.0"
description = "光学二维码单向摆渡传输系统 - PC 端"
requires-python = ">=3.11"
license = { text = "TBD" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
