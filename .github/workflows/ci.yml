name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt system dependencies (PySide6 headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Protocol JVM tests
        run: cd android && ./gradlew :protocol:test --no-daemon --console=plain
      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain

  # 仅在推送 v* tag 时发布：从 Secret 重建 keystore，签名并附到 GitHub Release。
  # 需配置 4 个仓库 Secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      # 从 base64 Secret 还原 keystore（不入库），路径与本地 keystore.properties 一致。
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      # 动态生成 keystore.properties，复用 build.gradle.kts 既有的 release 签名逻辑。
      - name: Generate keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          cd android && ./gradlew :app:assembleRelease \
            -PversionName="${TAG_VERSION#v}" \
            --no-daemon --console=plain

      # 重命名为带版本号的产物名，便于 Release 下载者识别。
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" \
               android/app/build/outputs/apk/release/qr-ferry-${{ github.ref_name }}-android.apk --clobber

  # PC 端 Windows 可执行包（PyInstaller）：tag 触发，与 Android 同一 Release。
  # needs release 确保 Release 已创建，PC 仅 upload 追加 zip，避免竞态。
  release-pc:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          # 打包用 headless opencv 省体积（qrferry 仅用采集/处理，不用 imshow/waitKey）
          pip uninstall -y opencv-python
          pip install opencv-python-headless
      # 裁剪未用的 PySide6 大模块 + headless opencv，显著缩小 zip。
      # shell: bash —— windows-latest 默认 pwsh 不认 `\` 续行，改用 git bash。
      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name qr-ferry --paths src \
            --collect-all segno --collect-all zxingcpp \
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.QtNetwork \
            --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            scripts/run_app.py
      - name: Package zip
        run: Compress-Archive -Path dist\qr-ferry -DestinationPath qr-ferry-${{ github.ref_name }}-windows-x64.zip
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "qr-ferry-${{ github.ref_name }}-windows-x64.zip" --clobber
