[project]
name = "qrferry"
version = "0.1.21"
description = "光学二维码单向摆渡传输系统 - PC 端"
requires-python = ">=3.11"
license = { text = "TBD" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# 文件优化器是 best-effort：任何一步失败都应静默跳过（跳过该候选优化），
# 而不是让发送端崩溃——宽捕获是本模块的既定语义。
"src/qrferry/app/file_optimizer.py" = ["BLE001", "S110"]
